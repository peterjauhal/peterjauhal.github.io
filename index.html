---
layout: default
---
<section>
  {% for post in site.posts %}
    <article class="post-card">
      <header>
        <h3 style="margin-bottom: 0.5rem;"><a href="{{ post.url }}" style="text-decoration: none;">{{ post.title }}</a></h3>
        <small style="color: #666;">{{ post.date | date: "%B %d, %Y" }}</small>
      </header>
      <p style="margin-top: 1rem; line-height: 1.6;">
        {{ post.excerpt | strip_html | truncatewords: 30 }}
      </p>
      <footer>
         {% if post.categories %}
           <small style="color: #777;">Tags: {{ post.categories | join: ', ' }}</small>
         {% endif %}
      </footer>
    </article>
  {% endfor %}
</section>
